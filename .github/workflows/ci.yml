name: CI
on:
  push:
  pull_request:

jobs:
  plsql:
    name: Migrations + utPLSQL on Oracle 23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Start Oracle Database 23 Free
        run: |
          docker run -d --name oracle -p 1521:1521 -e ORACLE_PASSWORD=oracle \
            -v "$PWD/db/setup:/container-entrypoint-initdb.d:ro" gvenzl/oracle-free:23-slim-faststart
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' oracle)" = healthy ] && exit 0; sleep 5
          done
          docker logs oracle; exit 1
      - name: Apply Flyway migrations to a clean schema (fails on any invalid PL/SQL)
        run: |
          mvn -B -q -DskipTests package
          SEED_DEMO=false DB_URL=jdbc:oracle:thin:@localhost:1521/FREEPDB1 \
            java -jar target/commissiondesk-*.jar --spring.main.web-application-type=none
      - name: Install utPLSQL
        run: db/test/install_utplsql.sh oracle oracle
      - name: Run PL/SQL unit tests
        run: db/test/run_tests.sh oracle

  java:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify

  docker:
    name: Docker image + Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the app, then check the seeded runs over HTTP
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8080/actuator/health/readiness | grep -q UP && break; sleep 5
          done
          curl -sf localhost:8080/api/runs | python3 -c "import sys,json; r=json.load(sys.stdin)['runs']; print(len(r),'runs'); assert len(r) > 30"
          curl -sf localhost:8080/ | grep -q CommissionDesk
      - if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v
