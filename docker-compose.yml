# docker compose up --build   ->   http://localhost:8080  (APP_PORT=8096 to use another host port)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
    ports:
      - "${ORACLE_PORT:-1522}:1521"
    volumes:
      - ./db/setup:/container-entrypoint-initdb.d:ro
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: commission
      DB_PASSWORD: commission
      SEED_DEMO: "true"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  oradata:
