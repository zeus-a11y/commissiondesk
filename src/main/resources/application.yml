spring:
  application:
    name: commissiondesk
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
    username: ${DB_USER:commission}
    password: ${DB_PASSWORD:commission}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  jackson:
    # Oracle DATEs are business dates in IST; serialise them in IST, not UTC
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

commissiondesk:
  # Load a synthetic book and approve its history on first start (empty schema only).
  seed-demo-data: ${SEED_DEMO:true}
  demo-policies: ${DEMO_POLICIES:6000}
  # The business date the API runs on. Blank means today; set it to replay a fixed day.
  as-of: ${AS_OF:}
